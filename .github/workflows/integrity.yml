name: Second Brain Integrity Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-second-brain:
    name: Validate Second Brain Structure & Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check application contracts and generated HTML
        run: npm run check

      - name: Validate production container
        run: docker build -t stanford-check .

      - name: Compile Python Tools
        run: |
          python -m py_compile agents/tools/*.py

      - name: Run Integrity Checker
        run: |
          python agents/tools/check_integrity.py

  cms:
    name: Content admin (Django) on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cms
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms-ci-only
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U cms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms-ci-only
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: cms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrations are complete
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py test content

      - name: Production security check
        env:
          DJANGO_DEBUG: '0'
          ADMIN_PATH: ci-secret-path-0000/
          DJANGO_ALLOWED_HOSTS: cms.example.org
          DJANGO_CSRF_TRUSTED_ORIGINS: https://cms.example.org
        run: DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(60))')" python manage.py check --deploy --fail-level WARNING
