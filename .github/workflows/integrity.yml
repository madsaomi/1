name: Site and admin checks

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  site:
    name: Static site and container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check application contracts and generated HTML
        run: npm run check

      - name: Validate production container
        run: docker build -t stanford-check .

      - name: Smoke-test the production container
        run: |
          set -euo pipefail
          docker run -d --name stanford-smoke -p 8080:8080 stanford-check
          trap 'docker rm -f stanford-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/healthz; then break; fi
            if [ "$attempt" -eq 60 ]; then
              echo "Container did not become healthy in 60 seconds" >&2
              docker logs stanford-smoke >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ -o /tmp/stanford-home.html
          grep -q Stanford /tmp/stanford-home.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/i18n/uz.js)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/results.html)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/results.js)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/career.html)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-such-page)" = "404"
          curl -fsSI http://localhost:8080/ -o /tmp/stanford-headers.txt
          grep -qi '^content-security-policy:' /tmp/stanford-headers.txt

  cms:
    name: Content admin (Django) on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cms
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms-ci-only
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U cms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms-ci-only
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: cms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrations are complete
        env:
          DJANGO_LOCAL: '1'
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          DJANGO_LOCAL: '1'
        run: python manage.py test content

      - name: Production security check
        env:
          DJANGO_LOCAL: '0'
          ADMIN_PATH: ci-secret-path-0000/
          DJANGO_ALLOWED_HOSTS: cms.example.org
          DJANGO_CSRF_TRUSTED_ORIGINS: https://cms.example.org
        run: DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(60))')" python manage.py check --deploy --fail-level WARNING

      - name: Build the admin image
        run: docker build -t stanford-cms .

      - name: Smoke-test media ownership and dropped privileges
        run: |
          set -euo pipefail
          task_media_volume="stanford-cms-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$task_media_volume"
          trap 'docker volume rm "$task_media_volume"' EXIT
          docker run --rm --entrypoint sh \
            --mount "type=volume,source=$task_media_volume,target=/app/media" \
            stanford-cms -c 'chown 0:0 /app/media; chmod 0700 /app/media; printf before > /app/media/before.txt'
          docker run --rm \
            --mount "type=volume,source=$task_media_volume,target=/app/media" \
            stanford-cms python -c 'import os; from pathlib import Path; media = Path("/app/media"); assert os.geteuid() == 10001; assert media.stat().st_uid == 10001; assert (media / "before.txt").stat().st_uid == 10001; assert (media / "before.txt").read_text() == "before"; (media / "written.txt").write_text("ok"); (media / "external-link").symlink_to("/etc"); print("PASS: uid 10001 can write the root-owned mounted volume")'
          if docker run --rm \
            --mount "type=volume,source=$task_media_volume,target=/app/media" \
            stanford-cms true; then
            echo "The entrypoint unexpectedly accepted a media symlink" >&2
            exit 1
          fi
          if docker run --rm --env MEDIA_ROOT=/tmp stanford-cms true; then
            echo "The entrypoint unexpectedly accepted a different media path" >&2
            exit 1
          fi
          if docker run --rm --entrypoint sh stanford-cms \
            -c 'rmdir /app/media; ln -s /tmp /app/media; exec /usr/local/bin/stanford-entrypoint true'; then
            echo "The entrypoint unexpectedly accepted a symlink as its media root" >&2
            exit 1
          fi

  hr:
    name: HR API (career form)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hr-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Tests
        run: node --test
